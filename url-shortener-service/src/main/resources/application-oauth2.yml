# Only loaded when the "oauth2" Spring profile is active
# (SPRING_PROFILES_ACTIVE=oauth2 or --spring.profiles.active=oauth2).
# This is what makes Google login truly optional: the registration below
# is absent from the default application.yml entirely, so a plain startup
# never even attempts to resolve GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET --
# there's nothing that would fail if they're unset. Only opting into this
# profile requires them.
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
